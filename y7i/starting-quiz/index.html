<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 8 (i) Starting quiz | Epsom Computer Science</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="../../assets/lesson.css">
</head>
<body>
<header>
  <div>
    <div class="brand">Epsom College Malaysia &middot; Computer Science</div>
    <h1>Year 8 (i): Starting quiz</h1>
  </div>
  <span class="spacer"></span>
  <label for="student-name">Name</label>
  <input id="student-name" autocomplete="name" placeholder="First and last name">
  
  <span id="handin-msg"></span>
</header>
<nav id="steps" aria-label="Lesson steps"></nav>
<main id="main">
  <section class="pane left">
    <div id="card"></div>
    <div id="editor-block">
      <div class="toolbar">
        <button class="btn" id="run">Run</button>
        <button class="btn grey" id="stop">Stop</button>
        <span class="spacer"></span>
        <button class="btn small grey" id="reset">Reset this step</button>
      </div>
      <div id="symbols"></div>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off"
                autocomplete="off" wrap="off" aria-label="Your code"></textarea>
    </div>
  </section>
  <section class="pane right">
    <div id="drawing-block" hidden>
      <div class="panehead" id="drawing-head">DRAWING<span class="spacer"></span>
        <button class="btn small grey" id="fit" title="Fill the box with what you drew">Fit</button>
        <button class="btn small grey" id="plain" title="Show the whole canvas again">Whole canvas</button></div>
      <div id="stage"><div id="turtle-canvas"></div></div>
    </div>
    <div id="expected-block" hidden>
      <div class="panehead">EXPECTED OUTPUT</div>
      <pre id="expected"></pre>
    </div>
    <div class="panehead" id="output-head">YOUR OUTPUT <span class="spacer"></span><span id="match"></span></div>
    <div id="console"></div>
    <div id="askrow">
      <input id="askinput" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn small" id="asksend">Enter</button>
    </div>
  </section>
</main>
<footer>
  <span>Your work is saved in this browser on this device. Send to my teacher sends it to your teacher.</span>
  <span class="spacer"></span>
  <span id="status"></span>
  <span class="credit">Made by Colin Sheehan, 2026</span>
</footer>
<script>window.LESSON = {"id": "y7i-starting-quiz", "order": 0.5, "label": "Quiz", "review": true, "reviews": "Reviews lessons 2 to 16.", "version": 1, "year": "Year 8 (i)", "slug": "starting-quiz", "folder": "y7i", "title": "Starting quiz", "short": "Starting quiz", "objective": "Show what you can do with the turtle: move, turn, colour, fill, loops, names and functions.", "keywords": ["forward", "turn", "colour", "loop", "function"], "steps": [{"kind": "questions", "nav": "1", "label": "Part 1", "title": "Move and colour", "check": "once", "intro": ["Read the code. Choose the answer. Do not run anything."], "questions": [{"id": "q1", "label": "Q1", "prompt": "What does this line do?", "code": "forward(200)", "pick": [{"v": "It draws a line."}, {"v": "It turns the turtle."}, {"v": "It changes the colour."}]}, {"id": "q2", "label": "Q2", "prompt": "The turtle faces right. Which way does it face now?", "code": "right(90)", "pick": [{"v": "up"}, {"v": "down"}, {"v": "left"}]}, {"id": "q3", "label": "Q3", "prompt": "What colour is the line?", "code": "pencolor(\"red\")\nforward(150)", "pick": [{"v": "black"}, {"v": "blue"}, {"v": "red"}]}, {"id": "q4", "label": "Q4", "prompt": "What is between the two short lines?", "code": "forward(60)\npenup()\nforward(40)\npendown()\nforward(60)", "pick": [{"v": "a long line"}, {"v": "a gap"}, {"v": "a star"}]}, {"id": "q5", "label": "Q5", "prompt": "What colour is inside the square?", "code": "pencolor(\"black\")\nfillcolor(\"green\")\nbegin_fill()\nfor i in range(4):\n    forward(100)\n    right(90)\nend_fill()", "pick": [{"v": "green"}, {"v": "black"}, {"v": "white"}]}], "key_b64": "eyJxMSI6Ikl0IGRyYXdzIGEgbGluZS4iLCJxMiI6ImRvd24iLCJxMyI6InJlZCIsInE0IjoiYSBnYXAiLCJxNSI6ImdyZWVuIn0="}, {"kind": "questions", "nav": "2", "label": "Part 2", "title": "Loops and names", "check": "once", "intro": ["Read the code. Choose the answer. Do not run anything."], "questions": [{"id": "q6", "label": "Q6", "prompt": "What shape does it draw?", "code": "for i in range(4):\n    forward(200)\n    right(90)", "pick": [{"v": "a triangle"}, {"v": "a square"}, {"v": "a line"}]}, {"id": "q7", "label": "Q7", "prompt": "How many sides does the shape have?", "code": "for i in range(6):\n    forward(100)\n    right(60)", "pick": [{"v": "4"}, {"v": "6"}, {"v": "60"}]}, {"id": "q8", "label": "Q8", "prompt": "How long is the line?", "code": "size = 50\nsize = 70\nforward(size)", "pick": [{"v": "50"}, {"v": "70"}, {"v": "120"}]}, {"id": "q9", "label": "Q9", "prompt": "What is x at the end?", "code": "x = -300\nx = x + 150", "pick": [{"v": "-150"}, {"v": "150"}, {"v": "-450"}]}], "key_b64": "eyJxNiI6ImEgc3F1YXJlIiwicTciOiI2IiwicTgiOiI3MCIsInE5IjoiLTE1MCJ9"}, {"kind": "questions", "nav": "3", "label": "Part 3", "title": "Functions", "check": "once", "intro": ["robot() draws one robot. Choose the answer. Do not run anything."], "questions": [{"id": "q10", "label": "Q10", "prompt": "How many robots does it draw?", "code": "def robot():\n    # the robot's lines\n\nrobot()\nrobot()", "pick": [{"v": "0"}, {"v": "1"}, {"v": "2"}]}, {"id": "q11", "label": "Q11", "prompt": "x is where the robot starts. Where is this robot?", "code": "def robot(x):\n    # the robot's lines\n\nrobot(150)", "pick": [{"v": "on the left"}, {"v": "in the middle"}, {"v": "on the right"}]}], "key_b64": "eyJxMTAiOiIyIiwicTExIjoib24gdGhlIHJpZ2h0In0="}, {"kind": "code", "nav": "4", "label": "Part 4", "title": "The roof", "turtle": true, "intro": ["The roof is a triangle. Replace ____ with the number of sides.", "Then press Run."], "code": "from turtle import *\npensize(3)\n\n# roof - a loop\nfillcolor(\"red\")\nbegin_fill()\nfor i in range(____):\n    forward(150)\n    left(120)\nend_fill()\n", "hint": "Count the sides of a triangle.", "questions": []}]};</script>
