nt: Already found\n#    If it is in secret, add it to found and print: Yes\n#    Otherwise print: No\n# 3. When found has 6 letters, print: You found every letter\n#    and set done to True.\n", "inputs": ["p", "z", "p", "y", "t", "h", "o", "n"], "hint": "Part 2 is an if, an elif and an else. Step 1 has the same shape.", "questions": [{"id": "mk1", "label": "M1", "prompt": "Copy the line that checks whether the letter is in secret."}, {"id": "mk2", "label": "M2", "prompt": "Write what your program printed for the test."}]}, {"kind": "questions", "nav": "Exit", "label": "Exit check", "title": "Questions on today's lesson", "intro": ["Answer without running anything.", "R1 to R3 and Steps 1 to 4 are adapted from Oak National Academy, Iterating through data structures.", "Licence: Open Government Licence v3.0."], "questions": [{"id": "e1", "label": "E1", "prompt": "Which condition adds city only when it is not already in trip?", "pick": [{"v": "if city in trip:"}, {"v": "if city not in trip:"}, {"v": "if trip in city:"}]}, {"id": "e2", "label": "E2", "prompt": "What is len(\"Kuala Lumpur\")?", "pick": [{"v": "11"}, {"v": "12"}, {"v": "2"}]}, {"id": "e3", "label": "E3", "prompt": "A loop starts with while done == False. Which line ends it?", "pick": [{"v": "done = True"}, {"v": "done = False"}, {"v": "done == True"}]}]}]};</script>
