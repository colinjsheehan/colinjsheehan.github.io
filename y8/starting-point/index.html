<body class="look-guide">
<header>
  <div>
    <div class="brand">Year 8 &middot; Computer Science</div>
    <h1>Starting point</h1>
  </div>
  <span class="spacer"></span>
  <label for="student-name">Name</label>
  <input id="student-name" autocomplete="name" placeholder="First and last name">
  
  <span id="handin-msg"></span>
</header>
<nav id="steps" aria-label="Lesson steps"></nav>
<main id="main">
  <section class="pane left">
    <div id="card"></div>
    <div id="editor-block">
      <div class="toolbar">
        <button class="btn" id="run">Run</button>
        <button class="btn grey" id="stop">Stop</button>
        <span class="spacer"></span>
        <button class="btn small grey" id="reset">Reset this step</button>
      </div>
      <div id="symbols"></div>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off"

    </div>
  </section>
  <section class="pane right">
    <div id="drawing-block" hidden>
      <div class="panehead" id="drawing-head">DRAWING<span class="spacer"></span>
        <button class="btn small grey" id="fit" title="Fill the box with what you drew">Fit</button>
        <button class="btn small grey" id="plain" title="Show the whole canvas again">Whole canvas</button></div>
      <div id="stage"><div id="turtle-canvas"></div></div>
    </div>
    <div id="expected-block" hidden>
      <div class="panehead">EXPECTED OUTPUT</div>
      <pre id="expected"></pre>
    </div>
    <div class="panehead" id="output-head">YOUR OUTPUT <span class="spacer"></span><span id="match"></span></div>
    <div id="console"></div>
    <div id="askrow">
      <input id="askinput" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn small" id="asksend">Enter</button>
    </div>
  </section>
</main>
<footer>

er", "title": "Loops", "intro": ["Answer without running anything."], "questions": [{"id": "q6a", "label": "6a", "prompt": "How many times does this loop run?", "code": "for i in range(7):"}, {"id": "q6b", "label": "6b", "prompt": "What turn does an octagon (8 sides) need at each corner?"}, {"id": "q6c", "label": "6c", "prompt": "How does Python know which lines are inside the loop?"}]}, {"kind": "code", "nav": "7", "label": "Lesson 4: fill the gap", "title": "Three paths", "remember": "Python checks from the top and runs only the first path that is True.", "intro": ["The rule: 3 or 4 sides is blue, 5 or 6 sides is green, 7 or 8 sides is purple.", "Replace ____ with a number. Then press Run. With 7 sides it should say purple."], "code": "sides = 7\n\nif sides <= 4:\n    colour = \"blue\"\nelif sides <= ____:\n    colour = \"green\"\nelse:\n    colour = \"purple\"\n\nprint(\"Colour:\", colour)\n", "hint": "Green is for 5 and 6. What is the largest number that is green?", "questions": [], "expected_b64": "Q29sb3VyOiBwdXJwbGU="}, {"kind": "questions", "nav": "8", "label": "Lesson 4: on paper", "title": "True or False", "intro": ["Answer without running anything."], "questions": [{"id": "q8a", "label": "8a", "prompt": "Is 8 >= 8 True or False?"}, {"id": "q8b", "label": "8b", "prompt": "What does this print?", "code": "age = 12\nif age > 12:\n    print(\"Older\")\nelse:\n    print(\"Not older\")"}]}, {"kind": "code", "nav": "9", "label": "Lesson 5: predict, then run", "title": "Text, not a number", "intro": ["When the program asks, you will type 13.", "Write your prediction in 9a. Then press Run."], "code": "age = input(\"How old are you? \")\n\nprint(age + age)\n", "inputs": ["13"], "predict_first": "q9a", "questions": [{"id": "q9a", "label": "9a", "prompt": "Predict what this prints."}], "expected_b64": "MTMxMw=="}, {"kind": "questions", "nav": "10", "label": "Lesson 5: on paper", "title": "Asking the user", "intro": ["Answer without running anything."], "questions": [
