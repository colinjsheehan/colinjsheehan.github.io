<script>window.LESSON = {"id": "y10-loops-exam-practice", "order": 7.5, "label": "7b", "group": "loops-pseudocode", "part": "Part 2: exam practice", "version": 2, "year": "Year 10", "slug": "loops-exam-practice", "folder": "y10", "title": "Loops: exam practice", "short": "Lesson 7b", "objective": "Trace, correct and rewrite loops in Cambridge pseudocode, using questions from past and specimen papers.", "keywords": ["trace table", "error", "REPEAT", "WHILE", "FOR", "counter"], "steps": [{"kind": "questions", "nav": "1", "label": "Step 1: trace table", "title": "Trace a REPEAT loop", "remember": "Write outputs without quotation marks. Once the loop stops, make no more entries.", "intro": ["This is a Cambridge question, with its errors already corrected. The input data is 34.22, 36.1, 37.4, 38.0, 999, -1.", "The table shows the first input. Trace the rest in 1a."], "readonly": "01 REPEAT\n02     OUTPUT \"Please enter temperature \"\n03     INPUT Temperature\n04     IF Temperature <> 999\n05        THEN\n06          IF Temperature > 38.0\n07             THEN\n08               OUTPUT \"Temperature too high\"\n09          ENDIF\n10          IF Temperature < 35.0\n11             THEN\n12               OUTPUT \"Temperature too low\"\n13          ENDIF\n14          IF Temperature >= 35.0 AND Temperature <= 38.0\n15             THEN\n16               OUTPUT \"Temperature normal\"\n17          ENDIF\n18     ENDIF\n19 UNTIL Temperature = 999", "table": {"headers": ["Temperature", "OUTPUT"], "rows": [["", "Please enter temperature"], ["34.22", "Temperature too low"]]}, "questions": [{"id": "s6a", "label": "1a", "prompt": "Complete the trace for the other inputs. Write one row per line: Temperature, OUTPUT. [2]"}, {"id": "s6b", "label": "1b", "prompt": "The last input, -1, never appears in the table. Explain why."}]}, {"kind": "questions", "nav": "2", "label": "Step 2: find and correct", "title": "Four errors in a WHILE loop", "intro": ["This is a Cambridge question. The algorithm should output only numbers that are greater than or equal to 100. The number 999 is not output and stops the algorithm.", "Identify the four errors and suggest a correction for each."], "readonly": "INPUT Number\nWHILE Numbers <> 999 DO\n    IF Number > 100\n      THEN\n        OUTPUT Number\n    ENDIF\nENDWHILE\nOUTPUT Number", "hint": "Trace it with the input 150. Ask what happens to Number after the first pass.", "questions": [{"id": "s7a", "label": "2a", "prompt": "Error 1 and its correction."}, {"id": "s7b", "label": "2b", "prompt": "Error 2 and its correction."}, {"id": "s7c", "label": "2c", "prompt": "Error 3 and its correction."}, {"id": "s7d", "label": "2d", "prompt": "Error 4 and its correction."}]}, {"kind": "questions", "nav": "3", "label": "Step 3: find and correct", "title": "Four errors in a guessing game", "remember": "RANDOM() gives a random number from 0 to 1. ROUND(X, 0) rounds X to 0 decimal places, which is a whole number.", "intro": ["This is a Cambridge question. The algorithm makes a random whole number from 1 to 100 in N. The user guesses until correct.", "After each guess it says higher or lower. At the end it outputs the number of guesses.", "Give the line number of each error and a correction."], "readonly": "01 Counter \u2190 0\n02 N \u2190 ROUND(RANDOM() * 99, 1) + 1\n03 REPEAT\n04     OUTPUT \"Please enter a guess\"\n05     INPUT G\n06     IF G > N\n07       THEN\n08         OUTPUT \"The number is lower than your guess\"\n09       ELSE\n10         IF G < N\n11           THEN\n12             OUTPUT \"The number is lower than your guess\"\n13         ENDIF\n14         Counter \u2190 Counter + 1\n15     ENDIF\n16 UNTIL G = N\n17 OUTPUT \"Well done, you took \", Guess, \" attempts\"", "questions": [{"id": "s8a", "label": "3a", "prompt": "Error 1: the line number and the correction."}, {"id": "s8b", "label": "3b", "prompt": "Error 2: the line number and the correction."}, {"id": "s8c", "label": "3c", "prompt": "Error 3: the line number and the correction."}, {"id": "s8d", "label": "3d", "prompt": "Error 4: the line number and the correction."}]}, {"kind": "code", "nav": "4", "label": "Step 4: fix and run", "title": "The misplaced counter in Python", "remember": "Python has no REPEAT. Setting guess to 0 before the while loop makes the body run at least once.", "intro": ["This is Step 3 in Python, with N fixed at 37. The counter line is in the wrong place, as on line 14.", "Run it and type 50, 20 and 37. It should take 3 attempts.", "Move the counter line so that every guess is counted."], "code": "n = 37\ncounter = 0\nguess = 0\nwhile guess != n:\n    guess = int(input(\"Please enter a guess: \"))\n    if guess > n:\n        print(\"The number is lower than your guess\")\n    else:\n        if guess < n:\n            print(\"The number is higher than your guess\")\n        counter = counter + 1\nprint(\"Well done, you took\", counter, \"attempts\")\n", "inputs": ["50", "20", "37"], "hint": "The counter line must run for every guess, so it goes inside the loop but outside the if and else.", "questions": [{"id": "s9a", "label": "4a", "prompt": "Before your fix, the program said 2 attempts. Which guess was not counted, and why?"}], "expected_b64": "VGhlIG51bWJlciBpcyBsb3dlciB0aGFuIHlvdXIgZ3Vlc3MKVGhlIG51bWJlciBpcyBoaWdoZXIgdGhhbiB5b3VyIGd1ZXNzCldlbGwgZG9uZSwgeW91IHRvb2sgMyBhdHRlbXB0cw==", "req_b64": "WyJ3aGlsZSBndWVzcyAhPSBuOiIsImNvdW50ZXIgPSBjb3VudGVyICsgMSJd"}, {"kind": "questions", "nav": "5", "label": "Step 5: rewrite", "title": "Rewrite a FOR loop as a WHILE loop", "intro": ["This is a Cambridge question. A is a list of 12 numbers, and A[Counter] is the number in position Counter.", "Rewrite the whole algorithm with a WHILE loop in 5a."], "readonly": "B \u2190 FALSE\nINPUT Num\nFOR Counter \u2190 1 TO 12\n    IF A[Counter] = Num\n      THEN\n        B \u2190 TRUE\n    ENDIF\nNEXT Counter", "points": ["Counter is given its first value before the loop.", "The WHILE condition at the start stops the loop after 12.", "Counter goes up by 1 inside the loop."], "hint": "A FOR loop changes Counter for you. A WHILE loop does not, so you write both lines.", "questions": [{"id": "s10a", "label": "5a", "prompt": "Rewrite the algorithm. [4]"}]}, {"kind": "questions", "nav": "X1", "label": "Extension X1 (optional)", "title": "A FOR loop inside a REPEAT loop", "remember": "STEP -1 counts down: 4, 3, 2, 1. An input of -1 ends the REPEAT loop.", "intro": ["This is a Cambridge question. The input data is 5, 6, -1, 20, 9, 4.", "The table shows the trace for the first input, 5. Trace the rest in X1a."], "readonly": "DECLARE Count : INTEGER\nDECLARE Answer : INTEGER\nDECLARE Value : INTEGER\nREPEAT\n    INPUT Value\n    IF Value <> -1\n      THEN\n        Answer \u2190 Value\n        FOR Count \u2190 Value - 1 TO 1 STEP -1\n            Answer \u2190 Answer * Count\n        NEXT Count\n        OUTPUT Answer\n    ENDIF\nUNTIL Value = -1", "table": {"headers": ["Value", "Count", "Answer", "OUTPUT"], "rows": [["5", "", "5", ""], ["", "4", "20", ""], ["", "3", "60", ""], ["", "2", "120", ""], ["", "1", "120", "120"]]}, "questions": [{"id": "x1a", "label": "X1a", "prompt": "Complete the trace for the input 6. Write one row per line: Value, Count, Answer, OUTPUT."}, {"id": "x1b", "label": "X1b", "prompt": "The inputs 20, 9 and 4 never appear in the table. Explain why."}, {"id": "x1c", "label": "X1c", "prompt": "State the purpose of this algorithm. [1]"}]}]};</script>
