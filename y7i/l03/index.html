<nav id="steps" aria-label="Lesson steps"></nav>

    <div id="drawing-block" hidden>
      <div class="panehead">PICTURE</div>
      <div id="stage"><div id="turtle-canvas"></div></div>

    <div id="expected-block" hidden>
      <div class="panehead">LOOK</div>
      <pre id="expected"></pre>
    </div>
    <div class="panehead">&#8250;_ <span class="spacer"></span><span id="match"></span></div>
    <div id="console"></div>
    <div id="askrow">
      <input id="askinput" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn small" id="asksend">&#8629;</button>
    </div>
  </section>
</main>
<footer>
  <span></span>
  <span class="spacer"></span>
  <span id="status"></span>
