<body>
<header>
  <div>
    <div class="brand">Epsom College Malaysia &middot; Computer Science</div>
    <h1>Year 8 (i): Starting quiz</h1>
  </div>
  <span class="spacer"></span>
  <label for="student-name">Name</label>
  <input id="student-name" autocomplete="name" placeholder="First and last name">
  
  <span id="handin-msg"></span>
</header>
<nav id="steps" aria-label="Lesson steps"></nav>
<main id="main">
  <section class="pane left">
    <div id="card"></div>
    <div id="editor-block">
      <div class="toolbar">
        <button class="btn" id="run">Run</button>
        <button class="btn grey" id="stop">Stop</button>
        <span class="spacer"></span>
        <button class="btn small grey" id="reset">Reset this step</button>
      </div>
      <div id="symbols"></div>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off"
                autocomplete="off" wrap="off" aria-label="Your code"></textarea>
    </div>
  </section>
  <section class="pane right">
    <div id="drawing-block" hidden>
      <div class="panehead" id="drawing-head">DRAWING<span class="spacer"></span>
        <button class="btn small grey" id="fit" title="Fill the box with what you drew">Fit</button>
        <button class="btn small grey" id="plain" title="Show the whole canvas again">Whole canvas</button></div>
      <div id="stage"><div id="turtle-canvas"></div></div>
    </div>
    <div id="expected-block" hidden>
      <div class="panehead">EXPECTED OUTPUT</div>
      <pre id="expected"></pre>
    </div>
    <div class="panehead" id="output-head">YOUR OUTPUT <span class="spacer"></span><span id="match"></span></div>
    <div id="console"></div>
    <div id="askrow">
      <input id="askinput" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn small" id="asksend">Enter</button>
    </div>
  </section>
</main>
<footer>
  <span>Your work is saved in this browser on this device. Send to my teacher sends it to your teacher.</span>
  <span class="spacer"></span>
  <span id="status"></span>
  <span class="credit">Made by Colin Sheehan, 2026</span>
</footer>

pt": "The user types 13. What does it print?", "code": "age = input(\"How old are you? \")\nprint(age + age)", "pick": [{"v": "26"}, {"v": "1313"}, {"v": "13"}]}, {"id": "q13", "label": "Q13", "prompt": "Where does the value in name come from?", "code": "name = input(\"What is your name? \")", "pick": [{"v": "the program"}, {"v": "what the user types"}, {"v": "the screen"}]}, {"id": "q14", "label": "Q14", "prompt": "Is 8 >= 8 True or False?", "pick": [{"v": "True"}, {"v": "False"}]}, {"id": "q15", "label": "Q15", "prompt": "What does it print?", "code": "age = 12\nif age > 12:\n    print(\"Older\")\nelse:\n    print(\"Not older\")", "pick": [{"v": "Older"}, {"v": "Not older"}, {"v": "12"}]}, {"id": "q16", "label": "Q16", "prompt": "Which symbol checks if two values are equal?", "pick": [{"v": "="}, {"v": "=="}, {"v": ">="}]}, {"id": "q17", "label": "Q17", "prompt": "How many times does this loop run?", "code": "for i in range(7):", "pick": [{"v": "6"}, {"v": "7"}, {"v": "8"}]}], "key_b64": "eyJxMTIiOiIxMzEzIiwicTEzIjoid2hhdCB0aGUgdXNlciB0eXBlcyIsInExNCI6IlRydWUiLCJxMTUiOiJOb3Qgb2xkZXIiLCJxMTYiOiI9PSIsInExNyI6IjcifQ=="}, {"kind": "questions", "nav": "6", "label": "Part 6", "title": "Binary", "check": "once", "intro": ["Choose the answer. Do not run anything."], "questions": [{"id": "q18", "label": "Q18", "prompt": "How many bits are in a byte?", "pick": [{"v": "2"}, {"v": "8"}, {"v": "10"}]}, {"id": "q19", "label": "Q19", "prompt": "How many bits are in a nibble?", "pick": [{"v": "4"}, {"v": "8"}, {"v": "16"}]}, {"id": "q20", "label": "Q20", "prompt": "In binary, the column on the left of 16 is worth ...", "pick": [{"v": "8"}, {"v": "17"}, {"v": "32"}]}, {"id": "q21", "label": "Q21", "prompt": "What is 1001 in denary?", "pick": [{"v": "2"}, {"v": "9"}, {"v": "1001"}]}, {"id": "q22", "label": "Q22", "prompt": "What is 00001111 in denary?", "pick": [{"v": "4"}, {"v": "15"}, {"v": "1111"}]}, {"id": "q23", "label": "Q23", "prompt": "What is the largest denary number that
