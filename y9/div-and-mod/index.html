he items left over. Then press Run."], "code": "items = 23\n\ncomplete_boxes = items // 6\nleft_over = ____\n\nprint(\"Complete boxes:\", complete_boxes)\nprint(\"Left over:\", left_over)\n", "hint": "It is the line above with one symbol changed.", "questions": [], "expected_b64": "Q29tcGxldGUgYm94ZXM6IDMKTGVmdCBvdmVyOiA1"}, {"kind": "code", "nav": "4", "label": "Step 4: find and fix", "title": "One box too many", "remember": "Another box is needed only when something is left over.", "intro": ["24 items fill exactly 4 boxes. This program says 5.", "Press Run. Answer 4a.", "Then change one symbol in the if line so it prints 4."], "code": "items = 24\n\ntotal_boxes = items // 6\nif items % 6 >= 0:\n    total_boxes = total_boxes + 1\n\nprint(\"Boxes needed:\", total_boxes)\n", "hint": "items % 6 is 0 here. Is 0 >= 0 True or False?", "questions": [{"id": "s4a", "label": "4a", "prompt": "What is items % 6 when there are 24 items?"}], "expected_b64": "Qm94ZXMgbmVlZGVkOiA0"}, {"kind": "code", "nav": "5", "label": "Step 5: fill the gap", "title": "The packing calculator", "intro": ["This version asks for the number of items.", "Replace ____ with a number. Press Run and type 25."], "code": "items = int(input(\"How many items? \"))\n\ntotal_boxes = items // 6\nif items % 6 > 0:\n    total_boxes = total_boxes + ____\n\nprint(\"Boxes needed:\", total_boxes)\n", "inputs": ["25"], "hint": "One extra box holds the items left over.", "questions": [{"id": "s5a", "label": "5a", "prompt": "How many items go in the last box?"}], "expected_b64": "Qm94ZXMgbmVlZGVkOiA1"}, {"kind": "questions", "nav": "Exit", "label": "Exit check", "title": "Questions on today's lesson", "intro": ["Answer without running anything."], "questions": [{"id": "e1", "label": "E1", "prompt": "What does this print?", "code": "print(17 // 5)"}, {"id": "e2", "label": "E2", "prompt": "What does this print?", "code": "print(17 % 5)"}, {"id": "e3", "label": "E3", "prompt": "How many boxes of 6 are needed for 13 items?"
