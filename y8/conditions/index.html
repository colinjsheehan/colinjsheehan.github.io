<body>
<header>
  <div>
    <div class="brand">Epsom College Malaysia &middot; Computer Science</div>
    <h1>Year 8: Conditions</h1>
  </div>
  <span class="spacer"></span>
  <label for="student-name">Name</label>
  <input id="student-name" autocomplete="name" placeholder="First and last name">
  <button class="btn amber" id="handin">Hand in (PDF)</button>
  <span id="handin-msg"></span>
</header>
<nav id="steps" aria-label="Lesson steps"></nav>
<main id="main">
  <section class="pane left">
    <div id="card"></div>
    <div id="editor-block">
      <div class="toolbar">
        <button class="btn" id="run">Run</button>
        <button class="btn grey" id="stop">Stop</button>
        <span class="spacer"></span>
        <button class="btn small grey" id="reset">Reset this step</button>
      </div>
      <div id="symbols"></div>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off"
                autocomplete="off" wrap="off" aria-label="Your code"></textarea>
    </div>
  </section>
  <section class="pane right">
    <div id="drawing-block" hidden>
      <div class="panehead" id="drawing-head">DRAWING<span class="spacer"></span>
        <button class="btn small grey" id="fit" title="Fill the box with what you drew">Fit</button>
        <button class="btn small grey" id="plain" title="Show the whole canvas again">Whole canvas</button></div>
      <div id="stage"><div id="turtle-canvas"></div></div>
    </div>
    <div id="expected-block" hidden>
      <div class="panehead">EXPECTED OUTPUT</div>
      <pre id="expected"></pre>
    </div>
    <div class="panehead" id="output-head">YOUR OUTPUT <span class="spacer"></span><span id="match"></span></div>
    <div id="console"></div>
    <div id="askrow">
      <input id="askinput" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn small" id="asksend">Enter</button>
    </div>
  </section>
</main>
<footer>
  <span>Your work is saved in this browser on this device. Hand in makes a PDF to upload to Google Classroom.</span>
  <span class="spacer"></span>
  <span id="status"></span>
  <span class="credit">Made by Colin Sheehan, 2026</span>
</footer>

lour is the square?"}], "expected_b64": "RmFsc2U="}, {"kind": "code", "nav": "3", "label": "Step 3: fill the gap", "title": "Three paths", "remember": "Python checks from the top and runs only the first path that is True.", "intro": ["The rule: 3 or 4 sides is blue, 5 or 6 sides is green, 7 or 8 sides is purple.", "Replace ____ with a number. Then press Run. With 7 sides it should say purple."], "code": "sides = 7\n\nif sides <= 4:\n    colour = \"blue\"\nelif sides <= ____:\n    colour = \"green\"\nelse:\n    colour = \"purple\"\n\nprint(\"Colour:\", colour)\n", "hint": "Green is for 5 and 6. What is the largest number that is green?", "questions": [{"id": "s3a", "label": "3a", "prompt": "Why is 7 a better test value than 5 for this program?"}], "expected_b64": "Q29sb3VyOiBwdXJwbGU="}, {"kind": "code", "nav": "4", "label": "Step 4: find and fix", "title": "Wrong at the edge", "intro": ["The pass mark is 50 or more. A mark of 50 should pass, but this program says Fail.", "Press Run. Answer 4a.", "Then change one symbol in the if line."], "code": "mark = 50\n\nif mark > 50:\n    print(\"Pass\")\nelse:\n    print(\"Fail\")\n", "hint": "Step 1 used a different comparison.", "questions": [{"id": "s4a", "label": "4a", "prompt": "Is 50 > 50 True or False?"}], "expected_b64": "UGFzcw=="}, {"kind": "code", "nav": "5", "label": "Step 5: fill the gap", "title": "The house that decides", "turtle": true, "intro": ["size 1 is small (60), size 2 is medium (120), size 3 is large (180).", "Replace ____ with the wall length for medium. Then press Run."], "code": "from turtle import *\npensize(3)\n\nsize = 2\n\nif size == 1:\n    wall = 60\nelif size == 2:\n    wall = ____\nelse:\n    wall = 180\n\nfor side in range(4):\n    forward(wall)\n    right(90)\n\nprint(\"Wall:\", wall)\n", "hint": "Read the first line of the step card.", "questions": [{"id": "s5a", "label": "5a", "prompt": "What does == mean in the if line?"}], "expected_b64": "V2FsbDogMTIw"}, {"kind": "questions", "nav": "
