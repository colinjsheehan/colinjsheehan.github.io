nprint(\"Sign:\", street[0:____])\n\n# start on the left\npenup()\ngoto(-300, -100)\npendown()\n\ncount = 0                     # START\nwhile count < houses:         # CONDITION\n    # the house: a filled square\n    fillcolor(wall_colour)\n    begin_fill()\n    forward(size)\n    left(90)\n    forward(size)\n    left(90)\n    forward(size)\n    left(90)\n    forward(size)\n    left(90)\n    end_fill()\n    # move along to the next house\n    penup()\n    forward(size + 20)\n    pendown()\n    count = count + 1         # CHANGE\n\nprint(\"Size:\", size)\nprint(\"Walls:\", wall_colour)\nprint(\"Houses drawn:\", count)\n", "questions": [{"id": "q8a", "label": "8a", "prompt": "In exam pseudocode the first character is at position 1. What is its Python index? [1]"}], "inputs": ["4", "Orchid"], "expected_b64": "U3RyZWV0OiBPcmNoaWQKTGV0dGVyczogNgpTaWduOiBPcmMKU2l6ZTogNjAKV2FsbHM6IG9yYW5nZQpIb3VzZXMgZHJhd246IDQ="}, {"kind": "code", "nav": "9", "label": "Step 9", "title": "A procedure for the house", "turtle": true, "intro": ["[2] The house lines are now in a procedure, draw_house. Replace ____ so the loop calls it with the wall colour.", "Press Run. When it asks, type 4, then Orchid."], "code": "from turtle import *\nspeed(0)\npensize(3)\n\nsize = 60\nwall_colour = \"orange\"\n\n# the house: a procedure\ndef draw_house(colour):\n    fillcolor(colour)\n    begin_fill()\n    forward(size)\n    left(90)\n    forward(size)\n    left(90)\n    forward(size)\n    left(90)\n    forward(size)\n    left(90)\n    end_fill()\n\nhouses = int(input(\"How many houses, 1 to 5? \"))\nwhile houses < 1 or houses > 5:\n    print(\"That is not between 1 and 5.\")\n    houses = int(input(\"How many houses, 1 to 5? \"))\n\nstreet = input(\"Street name? \")\nprint(\"Street:\", street)\nprint(\"Letters:\", len(street))\nprint(\"Sign:\", street[0:3])\n\n# start on the left\npenup()\ngoto(-300, -100)\npendown()\n\ncount = 0                     # START\nwhile count < houses:         # CONDITION\n alls:\", wall_colour)\nprint(\"Houses drawn:\", count)\nlength = ____\nprint(\"Street length:\", length)\n", "questions": [{"id": "q10a", "label": "10a", "prompt": "Why must street_length use return and not print? [1]"}, {"id": "q10b", "label": "10b", "prompt": "Which of the two, draw_house or street_length, gives a value back? [1]"}], "inputs": ["4", "Orchid"], "expected_b64": "U3RyZWV0OiBPcmNoaWQKTGV0dGVyczogNgpTaWduOiBPcmMKU2l6ZTogNjAKV2FsbHM6IG9yYW5nZQpIb3VzZXMgZHJhd246IDQKU3RyZWV0IGxlbmd0aDogMzIw", "req_b64": "WyJzdHJlZXRfbGVuZ3RoKGhvdXNlcykiXQ=="}]};</script>
